<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Garden</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #03060f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; touch-action: none;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(2,3,10,.85) 100%);
  }
  .title {
    position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%);
    margin: 0; pointer-events: none; text-align: center;
    color: rgba(220,240,255,.82); font-weight: 300;
    font-size: clamp(1.4rem, 4vw, 2.6rem); letter-spacing: .32em; text-transform: uppercase;
    text-shadow: 0 0 24px rgba(120,255,210,.45);
    opacity: 0; animation: fadeIn 3.2s ease 0.6s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  button#toggle {
    position: fixed; right: 18px; bottom: 18px; z-index: 2;
    padding: .6em 1.1em; border-radius: 999px;
    border: 1px solid rgba(180,235,255,.35);
    background: rgba(8,16,34,.55); color: #d8f4ff;
    font: inherit; font-size: .9rem; letter-spacing: .08em; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  button#toggle:hover { background: rgba(30,60,90,.6); }
  button#toggle:focus-visible { outline: 2px solid #8ff5d6; outline-offset: 3px; }
  .hint {
    position: fixed; left: 18px; bottom: 18px; margin: 0; z-index: 1;
    color: rgba(200,230,255,.5); font-size: .8rem; letter-spacing: .05em; pointer-events: none;
  }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="Animated aurora garden" role="img"></canvas>
<div class="vignette" aria-hidden="true"></div>
<h1 class="title" aria-hidden="true">Aurora Garden</h1>
<p class="hint">Move to bend the light · Click or tap for a burst · Space to pause</p>
<button id="toggle" type="button" aria-pressed="false">Pause</button>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('toggle');
  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');

  let W = 0, H = 0, DPR = 1;
  const pointer = { x: -9999, y: -9999, vx: 0, vy: 0, active: false };
  let paused = false;
  let reduced = reduceMq.matches;
  let time = 0;
  let last = performance.now();
  const bursts = [];
  const stars = [];
  const particles = [];

  const ribbonDefs = [
    { hue: 165, amp: 0.10, freq: 0.9, speed: 0.12, width: 0.16, y: 0.36, alpha: 0.5 },
    { hue: 195, amp: 0.13, freq: 0.7, speed: 0.09, width: 0.22, y: 0.30, alpha: 0.35 },
    { hue: 275, amp: 0.08, freq: 1.2, speed: 0.15, width: 0.12, y: 0.42, alpha: 0.42 },
    { hue: 140, amp: 0.11, freq: 1.0, speed: 0.11, width: 0.18, y: 0.26, alpha: 0.38 },
    { hue: 310, amp: 0.06, freq: 1.5, speed: 0.18, width: 0.09, y: 0.48, alpha: 0.3 },
  ];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const count = Math.round(Math.min(220, Math.max(90, W * H / 9000)));
    stars.length = 0;
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H * 0.8,
        r: Math.random() * 1.4 + 0.2, tw: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.5,
      });
    }
    ctx.fillStyle = '#03060f';
    ctx.fillRect(0, 0, W, H);
  }

  function ribbonY(def, x, t) {
    const nx = x / W;
    const base = H * def.y;
    const wave = Math.sin(nx * def.freq * 4 + t * def.speed * 6) * H * def.amp
               + Math.sin(nx * 9 + t * 0.4 + def.hue) * H * def.amp * 0.25;
    // pointer bends nearby ribbons
    let bend = 0;
    if (pointer.active) {
      const dx = x - pointer.x, dy = base - pointer.y;
      const d = Math.hypot(dx, dy * 0.6);
      bend = Math.exp(-d * d / (W * W * 0.02)) * (pointer.y - base) * 0.25;
    }
    return base + wave + bend;
  }

  function drawRibbon(def, t, idx) {
    const thickness = H * def.width;
    const step = Math.max(6, W / 120);
    const hueShift = Math.sin(t * 0.05 + idx) * 12;
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    const h = def.hue + hueShift;
    grad.addColorStop(0, `hsla(${h}, 90%, 60%, 0)`);
    grad.addColorStop(0.3, `hsla(${h + 20}, 95%, 65%, ${def.alpha})`);
    grad.addColorStop(0.7, `hsla(${h - 15}, 90%, 60%, ${def.alpha})`);
    grad.addColorStop(1, `hsla(${h}, 90%, 60%, 0)`);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, ribbonY(def, 0, t));
    for (let x = step; x <= W + step; x += step) ctx.lineTo(x, ribbonY(def, x, t));
    for (let x = W + step; x >= 0; x -= step) {
      ctx.lineTo(x, ribbonY(def, x, t) + thickness * (0.6 + 0.4 * Math.sin(x / W * 5 + t)));
    }
    ctx.closePath();
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function spawnParticle(x, y, power, hue) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.5 + Math.random() * 2.5) * power;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.3,
      life: 1, decay: 0.008 + Math.random() * 0.012,
      r: 1 + Math.random() * 2.2, hue: hue + Math.random() * 40 - 20,
    });
  }

  function burst(x, y) {
    bursts.push({ x, y, r: 0, life: 1 });
    const hue = 150 + Math.random() * 150;
    for (let i = 0; i < 70; i++) spawnParticle(x, y, 1.6, hue);
  }

  function update(dt) {
    time += dt;
    for (const s of stars) s.tw += dt * s.sp;

    if (pointer.active) {
      for (let i = 0; i < 2; i++) {
        spawnParticle(pointer.x + (Math.random() - 0.5) * 20,
                      pointer.y + (Math.random() - 0.5) * 20,
                      0.25 + Math.hypot(pointer.vx, pointer.vy) * 0.05, 175);
      }
      pointer.vx *= 0.9; pointer.vy *= 0.9;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= 0.975; p.vy = p.vy * 0.975 - 0.01;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.r += dt * 0.5 * Math.max(W, H) * 0.3;
      b.life -= dt * 0.8;
      if (b.life <= 0) bursts.splice(i, 1);
    }
    if (particles.length > 1200) particles.splice(0, particles.length - 1200);
  }

  function render(t) {
    // soft trail fade rather than full clear
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(3,6,15,0.16)';
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      const a = 0.35 + 0.35 * Math.sin(s.tw);
      ctx.fillStyle = `rgba(210,235,255,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // aurora ribbons (additive)
    for (let i = 0; i < ribbonDefs.length; i++) drawRibbon(ribbonDefs[i], t, i);

    // particle trails
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${(p.life * 0.8).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }

    // click bursts (expanding rings)
    for (const b of bursts) {
      ctx.strokeStyle = `hsla(170, 100%, 75%, ${(b.life * 0.6).toFixed(3)})`;
      ctx.lineWidth = 2 * b.life + 0.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      update(dt);
      render(time);
    }
    requestAnimationFrame(frame);
  }

  // Reduced motion: draw one still frame, no animation loop motion.
  function drawStill() {
    ctx.fillStyle = '#03060f';
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.fillStyle = 'rgba(210,235,255,0.5)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < ribbonDefs.length; i++) drawRibbon(ribbonDefs[i], 0, i);
    ctx.globalCompositeOperation = 'source-over';
  }

  function setPaused(p) {
    paused = p;
    btn.textContent = p ? 'Resume' : 'Pause';
    btn.setAttribute('aria-pressed', String(p));
    if (!p) last = performance.now();
  }

  function applyMotionPreference() {
    reduced = reduceMq.matches;
    if (reduced) {
      setPaused(true);
      drawStill();
      btn.textContent = 'Animate';
    }
  }

  btn.addEventListener('click', () => {
    if (reduced) {
      reduced = false;
      setPaused(false);
    } else {
      setPaused(!paused);
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target !== btn) {
      e.preventDefault();
      if (reduced) { reduced = false; setPaused(false); }
      else setPaused(!paused);
    } else if (e.code === 'Space' && e.target === btn) {
      e.preventDefault();
      btn.click();
    }
  });

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener('pointermove', (e) => {
    const p = pointerPos(e);
    pointer.vx = p.x - pointer.x; pointer.vy = p.y - pointer.y;
    if (!pointer.active) { pointer.x = p.x; pointer.y = p.y; }
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  canvas.addEventListener('pointerdown', (e) => {
    const p = pointerPos(e);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
    burst(p.x, p.y);
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      if (reduced) drawStill();
    }, 120);
  });

  if (reduceMq.addEventListener) reduceMq.addEventListener('change', applyMotionPreference);

  resize();
  applyMotionPreference();
  if (!reduced) {
    requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
  }
})();
</script>
</body>
</html>
