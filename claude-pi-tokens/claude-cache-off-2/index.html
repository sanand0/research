<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Garden</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #02030a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .title {
    position: fixed; left: 50%; top: 9vh; transform: translateX(-50%);
    margin: 0; pointer-events: none; text-align: center; white-space: nowrap;
    font-weight: 300; letter-spacing: 0.35em; text-transform: uppercase;
    font-size: clamp(0.8rem, 2.2vw, 1.1rem); color: rgba(220, 240, 255, 0.55);
    text-shadow: 0 0 18px rgba(120, 255, 210, 0.35);
  }
  button {
    position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(180, 230, 255, 0.35); background: rgba(10, 20, 45, 0.45);
    color: #d8f4ff; font: inherit; font-size: 0.85rem; letter-spacing: 0.08em;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover, button:focus-visible { background: rgba(40, 80, 120, 0.5); border-color: rgba(150, 255, 220, 0.7); outline: none; }
</style>
</head>
<body>
<canvas id="sky" aria-label="Animated aurora garden. Move the mouse or touch to stir the ribbons; click or tap to create a burst."></canvas>
<p class="title" aria-hidden="true">Aurora Garden</p>
<button id="toggle" type="button" aria-pressed="false" aria-label="Pause animation">Pause</button>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('toggle');
  const reduceMq = window.matchMedia('(prefers-reduced-motion: reduce)');

  let W = 0, H = 0, t = 0, last = performance.now();
  let paused = false;
  const pointer = { x: -9999, y: -9999, active: false, vx: 0, vy: 0 };
  const bursts = [], stars = [], trails = [];
  const RIBBONS = [
    { hue: 150, amp: 0.10, freq: 1.1, speed: 0.22, width: 0.16, y: 0.42, alpha: 0.55 },
    { hue: 180, amp: 0.08, freq: 1.5, speed: 0.30, width: 0.10, y: 0.36, alpha: 0.5 },
    { hue: 205, amp: 0.12, freq: 0.8, speed: 0.18, width: 0.20, y: 0.50, alpha: 0.35 },
    { hue: 280, amp: 0.07, freq: 1.8, speed: 0.26, width: 0.07, y: 0.30, alpha: 0.45 },
    { hue: 320, amp: 0.09, freq: 1.2, speed: 0.20, width: 0.09, y: 0.58, alpha: 0.30 },
  ];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(260, Math.max(90, W * H / 6000)));
    stars.length = 0;
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: 0.3 + Math.random() * 1.2, tw: Math.random() * Math.PI * 2,
        vx: (Math.random() - 0.5) * 0.15, vy: -0.05 - Math.random() * 0.12,
      });
    }
    draw(t);
  }

  function ribbonY(r, x, time) {
    const nx = x / W;
    const base = H * r.y;
    const wave = Math.sin(nx * Math.PI * 2 * r.freq + time * r.speed) * H * r.amp
               + Math.sin(nx * Math.PI * 5.3 - time * r.speed * 1.7) * H * r.amp * 0.35;
    let push = 0;
    if (pointer.active) {
      const dx = x - pointer.x, dy = base + wave - pointer.y;
      const d2 = dx * dx + dy * dy, R = 180;
      if (d2 < R * R) push = (1 - Math.sqrt(d2) / R) * (pointer.vy * 0.4 - (dy > 0 ? -1 : 1) * 40);
    }
    return base + wave + push;
  }

  function drawRibbon(r, time, index) {
    const step = 8;
    const thick = H * r.width;
    ctx.beginPath();
    for (let x = -step; x <= W + step; x += step) {
      const y = ribbonY(r, x, time);
      x === -step ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let x = W + step; x >= -step; x -= step) {
      const y = ribbonY(r, x, time) + thick * (0.6 + 0.4 * Math.sin(x * 0.004 + time * 0.5 + index));
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, H * r.y - H * r.amp, 0, H * r.y + thick * 1.6);
    g.addColorStop(0, `hsla(${r.hue}, 90%, 65%, 0)`);
    g.addColorStop(0.35, `hsla(${r.hue}, 95%, 65%, ${r.alpha})`);
    g.addColorStop(0.7, `hsla(${r.hue + 30}, 90%, 55%, ${r.alpha * 0.5})`);
    g.addColorStop(1, `hsla(${r.hue + 60}, 80%, 40%, 0)`);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fill();
  }

  function spawnBurst(x, y) {
    const n = 46;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      const s = 1.5 + Math.random() * 4;
      trails.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, hue: 150 + Math.random() * 160, size: 1 + Math.random() * 2.2 });
    }
    bursts.push({ x, y, r: 0, life: 1 });
  }

  function step(dt) {
    t += dt;
    for (const s of stars) {
      s.x += s.vx * dt * 60 * s.z;
      s.y += s.vy * dt * 60 * s.z;
      if (pointer.active) {
        const dx = s.x - pointer.x, dy = s.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < 22500) { const f = (1 - d2 / 22500) * 0.6; s.x += dx * f * 0.02 + pointer.vx * f * 0.3; s.y += dy * f * 0.02 + pointer.vy * f * 0.3; }
      }
      if (s.y < -5) { s.y = H + 5; s.x = Math.random() * W; }
      if (s.x < -5) s.x = W + 5; else if (s.x > W + 5) s.x = -5;
    }
    for (let i = trails.length - 1; i >= 0; i--) {
      const p = trails[i];
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
      p.vx *= 0.97; p.vy *= 0.97; p.life -= dt * 0.6;
      if (p.life <= 0) trails.splice(i, 1);
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.r += dt * 420; b.life -= dt * 1.1;
      if (b.life <= 0) bursts.splice(i, 1);
    }
    pointer.vx *= 0.9; pointer.vy *= 0.9;
  }

  function draw(time) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(3, 6, 18, 0.22)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const a = (0.35 + 0.35 * Math.sin(time * 2 + s.tw)) * Math.min(1, s.z);
      ctx.fillStyle = `rgba(200, 240, 255, ${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.z * 0.9, 0, Math.PI * 2); ctx.fill();
    }

    RIBBONS.forEach((r, i) => drawRibbon(r, time, i));

    for (const p of trails) {
      ctx.fillStyle = `hsla(${p.hue}, 95%, 70%, ${Math.max(0, p.life) * 0.9})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + p.life * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    for (const b of bursts) {
      ctx.strokeStyle = `hsla(170, 100%, 75%, ${b.life * 0.6})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused) return;
    step(dt);
    draw(t);
    requestAnimationFrame(frame);
  }

  function setPaused(p) {
    paused = p;
    btn.textContent = p ? 'Play' : 'Pause';
    btn.setAttribute('aria-pressed', String(p));
    btn.setAttribute('aria-label', p ? 'Resume animation' : 'Pause animation');
    if (!p) { last = performance.now(); requestAnimationFrame(frame); }
  }

  function pointerMove(e) {
    const px = pointer.x, py = pointer.y;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.active = true;
    if (px > -999) { pointer.vx = (pointer.x - px) * 0.5; pointer.vy = (pointer.y - py) * 0.5; }
  }

  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerdown', e => { pointerMove(e); if (!paused) spawnBurst(e.clientX, e.clientY); });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.x = pointer.y = -9999; });
  canvas.addEventListener('pointerup', () => { pointer.active = false; });
  btn.addEventListener('click', () => setPaused(!paused));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && (e.target === document.body || e.target === canvas || e.target === btn)) {
      e.preventDefault(); setPaused(!paused);
    }
  });
  window.addEventListener('resize', resize);

  // Reduced motion: start on a composed still frame; the user can still press Play.
  if (reduceMq.matches) {
    t = 6;
    setPaused(true);
  } else {
    setPaused(false);
  }
  resize();
})();
</script>
</body>
</html>
