<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Garden</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #03050d;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    cursor: crosshair; touch-action: none;
  }
  .title {
    position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%);
    margin: 0; pointer-events: none; text-align: center; white-space: nowrap;
    font-weight: 300; letter-spacing: 0.45em; text-transform: uppercase;
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    color: rgba(200, 235, 255, 0.55);
    text-shadow: 0 0 18px rgba(120, 220, 255, 0.5);
  }
  #toggle {
    position: fixed; right: 1.25rem; bottom: 1.25rem;
    padding: 0.55rem 1rem; border-radius: 999px;
    border: 1px solid rgba(170, 230, 255, 0.35);
    background: rgba(10, 20, 40, 0.45); color: #d8f3ff;
    font: inherit; font-size: 0.85rem; letter-spacing: 0.05em;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; transition: background 0.3s, border-color 0.3s;
  }
  #toggle:hover { background: rgba(60, 120, 170, 0.35); border-color: rgba(190, 240, 255, 0.6); }
  #toggle:focus-visible { outline: 2px solid #9be7ff; outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated aurora over a midnight garden. Move or tap to stir the sky." role="img"></canvas>
<h1 class="title">Aurora Garden</h1>
<button id="toggle" type="button" aria-pressed="false">Pause</button>
<div class="sr-only" id="status" aria-live="polite"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('toggle');
  const status = document.getElementById('status');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  let W = 0, H = 0, DPR = 1;
  const pointer = { x: -9999, y: -9999, vx: 0, vy: 0, active: false };
  let paused = false;
  let time = 0;
  let last = performance.now();
  let particles = [];
  const bursts = [];

  // Ribbon definitions: hue, base height, amplitude, frequency, thickness, phase
  const RIBBONS = [
    { hue: 165, y: 0.30, amp: 0.07, freq: 0.9, width: 150, speed: 0.10, phase: 0.0, alpha: 0.42 },
    { hue: 190, y: 0.38, amp: 0.09, freq: 0.7, width: 120, speed: 0.13, phase: 1.7, alpha: 0.38 },
    { hue: 275, y: 0.26, amp: 0.06, freq: 1.1, width: 180, speed: 0.08, phase: 3.1, alpha: 0.30 },
    { hue: 300, y: 0.44, amp: 0.05, freq: 1.4, width: 90,  speed: 0.17, phase: 4.6, alpha: 0.26 },
    { hue: 140, y: 0.22, amp: 0.10, freq: 0.5, width: 200, speed: 0.06, phase: 2.2, alpha: 0.22 },
  ];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const count = Math.min(260, Math.floor((W * H) / 5000));
    particles = Array.from({ length: count }, () => spawnParticle(true));
    drawStatic();
  }

  function spawnParticle(anywhere) {
    return {
      x: anywhere ? Math.random() * W : -10,
      y: Math.random() * H * 0.75,
      vx: 0, vy: 0,
      r: 0.5 + Math.random() * 1.6,
      life: 0, maxLife: 300 + Math.random() * 400,
      hue: 150 + Math.random() * 160,
      twinkle: Math.random() * Math.PI * 2,
    };
  }

  // Pre-render a soft vignette/horizon for depth
  let bg = null;
  function drawStatic() {
    bg = document.createElement('canvas');
    bg.width = canvas.width; bg.height = canvas.height;
    const g = bg.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#02030a');
    sky.addColorStop(0.6, '#070b22');
    sky.addColorStop(1, '#0b1a2e');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const moon = g.createRadialGradient(W * 0.78, H * 0.18, 0, W * 0.78, H * 0.18, Math.max(W, H) * 0.22);
    moon.addColorStop(0, 'rgba(210, 240, 255, 0.22)');
    moon.addColorStop(1, 'rgba(210, 240, 255, 0)');
    g.fillStyle = moon; g.fillRect(0, 0, W, H);
    const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = vig; g.fillRect(0, 0, W, H);
    // Ground / garden silhouette
    g.fillStyle = '#02040a';
    g.beginPath();
    g.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) {
      const y = H * 0.9 + Math.sin(x * 0.006) * 14 + Math.sin(x * 0.017 + 1.3) * 7 + Math.sin(x * 0.043) * 2;
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
  }

  function ribbonY(r, x, t) {
    const base = H * r.y;
    const nx = x / W;
    return base
      + Math.sin(nx * Math.PI * 2 * r.freq + t * r.speed * 6 + r.phase) * H * r.amp
      + Math.sin(nx * Math.PI * 5 + t * r.speed * 3 + r.phase * 2) * H * r.amp * 0.35
      + pointerInfluence(x, base, r);
  }

  function pointerInfluence(x, y, r) {
    if (!pointer.active) return 0;
    const dx = x - pointer.x, dy = y - pointer.y;
    const d2 = dx * dx + dy * dy;
    const radius = Math.min(W, H) * 0.25;
    if (d2 > radius * radius) return 0;
    const f = 1 - Math.sqrt(d2) / radius;
    return -pointer.vy * f * 2.2 + Math.sin(dx * 0.02) * f * 10;
  }

  function drawRibbon(r, t) {
    const steps = Math.max(40, Math.floor(W / 8));
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * W;
      pts.push([x, ribbonY(r, x, t)]);
    }
    const thick = r.width * (H / 800) + 40;
    // Layered glow: wide soft pass then tighter core
    for (let pass = 0; pass < 3; pass++) {
      const w = thick * (1 - pass * 0.3);
      const a = r.alpha * (0.5 + pass * 0.25);
      const grad = ctx.createLinearGradient(0, H * r.y - w, 0, H * r.y + w * 1.6);
      grad.addColorStop(0, `hsla(${r.hue}, 90%, 70%, 0)`);
      grad.addColorStop(0.45, `hsla(${r.hue}, 95%, 65%, ${a})`);
      grad.addColorStop(0.7, `hsla(${r.hue + 25}, 90%, 60%, ${a * 0.5})`);
      grad.addColorStop(1, `hsla(${r.hue + 40}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (const [x, y] of pts) ctx.lineTo(x, y - w * 0.4);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fill();
    }
    // Bright crest line
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.5 + (H / 800);
    ctx.strokeStyle = `hsla(${r.hue + 10}, 100%, 80%, 0.35)`;
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  function updateParticles(dt, t) {
    for (const p of particles) {
      const flow = Math.sin(p.x * 0.004 + t * 0.2) * 0.4 + Math.cos(p.y * 0.006 - t * 0.15) * 0.3;
      p.vx += (Math.cos(flow * 3) * 0.02 + 0.06 - p.vx * 0.02) * dt * 60;
      p.vy += (Math.sin(flow * 3) * 0.02 - p.vy * 0.02) * dt * 60;
      if (pointer.active) {
        const dx = p.x - pointer.x, dy = p.y - pointer.y;
        const d2 = dx * dx + dy * dy;
        const R = 140;
        if (d2 < R * R && d2 > 1) {
          const f = (1 - Math.sqrt(d2) / R) * 0.9;
          p.vx += (dx / Math.sqrt(d2)) * f * 0.25 * dt * 60 + pointer.vx * f * 0.02 * dt * 60;
          p.vy += (dy / Math.sqrt(d2)) * f * 0.25 * dt * 60 + pointer.vy * f * 0.02 * dt * 60;
        }
      }
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.life += dt * 60;
      p.twinkle += dt * 2;
      if (p.life > p.maxLife || p.x > W + 20 || p.x < -20 || p.y < -20 || p.y > H + 20) {
        Object.assign(p, spawnParticle(false));
      }
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const fade = Math.min(1, p.life / 60) * Math.min(1, (p.maxLife - p.life) / 90);
      const a = fade * (0.55 + 0.45 * Math.sin(p.twinkle));
      // trail
      ctx.strokeStyle = `hsla(${p.hue}, 100%, 75%, ${a * 0.35})`;
      ctx.lineWidth = p.r * 0.9;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 6, p.y - p.vy * 6);
      ctx.stroke();
      ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, ${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function spawnBurst(x, y) {
    const count = 70;
    const hueBase = 140 + Math.random() * 180;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.2;
      const s = 1.5 + Math.random() * 3.5;
      bursts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 80 + Math.random() * 60, hue: hueBase + Math.random() * 40 });
    }
    bursts.push({ ring: true, x, y, r: 0, life: 0, max: 60, hue: hueBase });
    for (const p of particles) {
      const dx = p.x - x, dy = p.y - y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 220) { p.vx += dx / d * 2; p.vy += dy / d * 2; }
    }
  }

  function updateBursts(dt) {
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life += dt * 60;
      if (b.ring) { b.r += dt * 60 * 4.5; if (b.life > b.max) bursts.splice(i, 1); continue; }
      b.vx *= 0.975; b.vy *= 0.975;
      b.vy += 0.01 * dt * 60;
      b.x += b.vx * dt * 60; b.y += b.vy * dt * 60;
      if (b.life > b.max) bursts.splice(i, 1);
    }
  }

  function drawBursts() {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bursts) {
      if (b.ring) {
        const a = 1 - b.life / b.max;
        ctx.strokeStyle = `hsla(${b.hue}, 100%, 75%, ${a * 0.5})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        const a = Math.max(0, 1 - b.life / b.max);
        ctx.fillStyle = `hsla(${b.hue}, 100%, 80%, ${a})`;
        ctx.beginPath(); ctx.arc(b.x, b.y, 1.8 * a + 0.4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      time += dt;
      pointer.vx *= 0.9; pointer.vy *= 0.9;
      step(dt, time);
    }
    render(time);
    requestAnimationFrame(frame);
  }

  function step(dt, t) {
    updateParticles(dt, t);
    updateBursts(dt);
  }

  function render(t) {
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < RIBBONS.length; i++) drawRibbon(RIBBONS[i], t);
    ctx.globalCompositeOperation = 'source-over';
    drawParticles();
    drawBursts();
  }

  // Interaction
  function setPointer(x, y) {
    const px = pointer.x, py = pointer.y;
    if (pointer.active) {
      pointer.vx = (x - px) * 0.5 + pointer.vx * 0.5;
      pointer.vy = (y - py) * 0.5 + pointer.vy * 0.5;
    }
    pointer.x = x; pointer.y = y; pointer.active = true;
  }
  canvas.addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  canvas.addEventListener('pointerdown', e => {
    setPointer(e.clientX, e.clientY);
    if (!paused) spawnBurst(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; });

  // Pause / resume
  function setPaused(p) {
    paused = p;
    btn.textContent = paused ? 'Play' : 'Pause';
    btn.setAttribute('aria-pressed', String(paused));
    status.textContent = paused ? 'Animation paused' : 'Animation playing';
  }
  btn.addEventListener('click', () => setPaused(!paused));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body || e.code === 'Space' && e.target === canvas) {
      e.preventDefault();
      setPaused(!paused);
    }
  });

  // Reduced motion: start paused-looking calm mode with slow time scale
  function applyMotionPref() {
    if (reduceMotion.matches) {
      setPaused(true);
      status.textContent = 'Reduced motion: animation paused. Press Space or Play to animate.';
    }
  }
  reduceMotion.addEventListener?.('change', applyMotionPref);

  window.addEventListener('resize', resize);
  resize();
  applyMotionPref();
  // Render a first frame even when paused; then loop.
  if (reduceMotion.matches) {
    time = 6;
    render(time);
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
