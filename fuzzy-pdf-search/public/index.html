<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuzzy PDF Search</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .upload-area {
      background: white;
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      transition: border-color 0.3s;
    }
    .upload-area:hover {
      border-color: #007bff;
    }
    .upload-area.dragover {
      border-color: #007bff;
      background: #e8f4ff;
    }
    input[type="file"] {
      display: none;
    }
    .upload-btn {
      background: #007bff;
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    .upload-btn:hover {
      background: #0056b3;
    }
    .upload-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 4px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body>
  <h1>Fuzzy PDF Search</h1>
  <p>Upload a PDF to enable fuzzy text search with shareable links.</p>

  <div class="upload-area" id="dropZone">
    <p>Drag & drop a PDF here, or click to select</p>
    <input type="file" id="fileInput" accept=".pdf,application/pdf">
    <button class="upload-btn" id="uploadBtn">Select PDF</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');

    // Click to upload
    uploadBtn.addEventListener('click', () => fileInput.click());

    // File selected
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        uploadFile(e.target.files[0]);
      }
    });

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type === 'application/pdf') {
        uploadFile(files[0]);
      } else {
        showStatus('Please drop a PDF file', 'error');
      }
    });

    function showStatus(message, type) {
      status.textContent = message;
      status.className = `status show ${type}`;
    }

    async function uploadFile(file) {
      showStatus('Uploading and processing PDF...', 'loading');
      uploadBtn.disabled = true;

      const formData = new FormData();
      formData.append('pdf', file);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Upload failed');
        }

        const data = await response.json();
        showStatus(`Success! Redirecting to viewer...`, 'success');

        // Redirect to viewer
        setTimeout(() => {
          window.location.href = `/view/${data.id}`;
        }, 1000);
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
        uploadBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
