<!DOCTYPE html>
<html>
<head>
  <title>CDP Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .box { padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    input { padding: 8px; margin: 5px; }
    #output { background: #f5f5f5; padding: 10px; min-height: 50px; }
  </style>
</head>
<body>
  <h1>CDP Test Page</h1>

  <div class="box">
    <h2>Form Interaction Test</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>

  <div class="box">
    <h2>Click Test</h2>
    <button id="counterBtn">Click me: <span id="count">0</span></button>
  </div>

  <div class="box">
    <h2>Output</h2>
    <div id="output"></div>
  </div>

  <script>
    let count = 0;

    document.getElementById('counterBtn').addEventListener('click', () => {
      count++;
      document.getElementById('count').textContent = count;
      log('Counter clicked: ' + count);
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      log('Login attempted with user: ' + user + ', password length: ' + pass.length);
    });

    function log(msg) {
      const output = document.getElementById('output');
      output.innerHTML += msg + '<br>';
    }

    log('Page loaded at: ' + new Date().toISOString());
  </script>
</body>
</html>
